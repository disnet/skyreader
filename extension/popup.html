<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --blue: #0066cc;
        --blue-hover: #0052a3;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e6e6e6;
        --red: #f44336;
        --green: #1a7f37;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        color: var(--ink);
        width: 320px;
        margin: 0;
        padding: 16px;
      }

      /* Page header */
      .page-title {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.3;
        /* Clamp to two lines. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .page-url {
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Primary save button */
      button.primary {
        width: 100%;
        margin-top: 12px;
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--blue);
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button.primary:hover:not(:disabled) {
        background: var(--blue-hover);
      }
      /* Already saved: outlined "done" look, still clickable to update in place. */
      button.primary.saved {
        color: var(--green);
        background: color-mix(in srgb, var(--green) 8%, #fff);
        border: 1px solid color-mix(in srgb, var(--green) 40%, transparent);
      }
      button.primary.saved:hover:not(:disabled) {
        background: color-mix(in srgb, var(--green) 14%, #fff);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .status {
        min-height: 16px;
        margin-top: 6px;
        color: var(--muted);
      }
      .status.error {
        color: var(--red);
      }
      .status.success {
        color: var(--green);
      }

      /* Feeds section */
      .section {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .section-label {
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.03em;
        margin-bottom: 8px;
      }
      .muted {
        color: var(--muted);
      }

      .feed {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
      }
      .feed + .feed {
        border-top: 1px solid var(--line);
      }
      /* standard.site publications get a distinct, branded treatment: a tinted
         card with an accent edge, lifting them above plain RSS rows. */
      .feed.standard {
        margin: 2px 0;
        padding: 8px 10px;
        border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, var(--blue) 7%, transparent);
      }
      .feed.standard + .feed {
        border-top: none;
      }
      .feed-icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        border-radius: 4px;
        object-fit: cover;
      }
      /* standard.site logo used as the avatar when a publication has no icon. */
      .feed-avatar {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        color: var(--blue);
      }
      .feed-info {
        flex: 1 1 auto;
        min-width: 0;
      }
      .feed-name {
        display: block;
        min-width: 0;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* "standard.site" pill, mirroring the badge in the web app's AddFeedModal. */
      .badge {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 1px 6px 1px 5px;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .badge svg {
        width: 11px;
        height: 11px;
      }
      /* RSS / Atom format tag — muted and outlined, deliberately quieter than
         the filled standard.site badge (standard.site is the promoted option). */
      .tag {
        flex: 0 0 auto;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        line-height: 15px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .feed-sub {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        margin-top: 1px;
        color: var(--muted);
      }
      .feed-sub .sub-url {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button.subscribe {
        flex: 0 0 auto;
        padding: 4px 10px;
        font: inherit;
        font-weight: 600;
        color: var(--blue);
        background: #fff;
        border: 1px solid var(--blue);
        border-radius: 6px;
        cursor: pointer;
      }
      button.subscribe:hover:not(:disabled) {
        background: color-mix(in srgb, var(--blue) 8%, transparent);
      }
      button.subscribe.done {
        color: var(--green);
        border-color: var(--line);
        cursor: default;
      }
      button.subscribe.failed {
        color: var(--red);
        border-color: var(--red);
      }
    </style>
  </head>
  <body>

      </symbol>
    </svg>

    <div class="page-title" id="pageTitle">This page</div>
    <div class="page-url" id="pageUrl"></div>

    <button class="primary" id="saveBtn">Save this page</button>
    <div class="status" id="saveStatus"></div>

    <div class="section">
      <div class="section-label">Feeds on this page</div>
      <div id="feeds">
        <div class="muted" id="feedsMsg">Looking for feeds…</div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
