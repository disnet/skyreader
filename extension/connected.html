<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skyreader</title>
    <style>
      :root {
        --blue: #0066cc;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --red: #c62828;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
        background: #fff;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
        margin: 0;
      }
      .error h1 {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <main id="main">
      <img src="icons/icon-128.png" alt="" />
      <h1 id="title">Connecting…</h1>
      <p id="detail"></p>
    </main>
    <script src="connected.js"></script>
  </body>
</html>
