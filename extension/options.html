<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        color: #1a1a1a;
        width: 320px;
        margin: 0;
        padding: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 12px 0 4px;
      }
      label:first-of-type {
        margin-top: 0;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        border: 1px solid #d4d4d4;
        border-radius: 4px;
      }
      input:focus {
        outline: 2px solid #0066cc;
        outline-offset: -1px;
        border-color: #0066cc;
      }
      .hint {
        color: #6b6b6b;
        margin: 4px 0 0;
      }
      button {
        margin-top: 16px;
        padding: 6px 14px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #0066cc;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #0052a3;
      }
      #status {
        margin-left: 8px;
        color: #6b6b6b;
      }
      #status.error {
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <label for="apiBase">API server</label>
    <input id="apiBase" type="url" placeholder="https://api.skyreader.app" />
    <p class="hint">Local dev: http://127.0.0.1:8787</p>

    <label for="frontendBase">Web app</label>
    <input id="frontendBase" type="url" placeholder="https://skyreader.app" />
    <p class="hint">Local dev: http://127.0.0.1:5173</p>

    <button id="save">Save</button><span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
