# XcodeGen spec. Skyreader.xcodeproj is generated from this and gitignored —
# run `xcodegen generate` in apple/ after pulling or editing this file.
name: Skyreader
options:
  bundleIdPrefix: app.skyreader
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    PRODUCT_NAME: Skyreader
    PRODUCT_BUNDLE_IDENTIFIER: app.skyreader.Skyreader
    GENERATE_INFOPLIST_FILE: 'YES'
    INFOPLIST_KEY_CFBundleDisplayName: Skyreader
packages:
  SkyreaderKit:
    path: Packages/SkyreaderKit
targets:
  Skyreader-iOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SkyreaderKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    scheme: {}
  Skyreader-macOS:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SkyreaderKit
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/Skyreader-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: 'YES'
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
    scheme: {}
