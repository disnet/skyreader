name: Deploy Feed Proxy

permissions:
  contents: read

on:
  workflow_dispatch:

  # The workflow file is in its own paths filter on purpose: a commit that only
  # changes this file still has to run it. Without that, a fix to the deploy
  # logic merges to main and never executes — which is exactly how the staging
  # proxy sat on a hand-deployed `version: dev` build after #390.
  push:
    branches: [main]
    paths: ['feed-proxy/**', '.github/workflows/feed-proxy-deploy.yml']
  pull_request:
    branches: [main]
    paths: ['feed-proxy/**', '.github/workflows/feed-proxy-deploy.yml']
  release:
    types: [published]

concurrency:
  group: feed-proxy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: feed-proxy

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  deploy-staging:
    name: Deploy to Staging
    needs: [typecheck, test]
    # Same cadence as the staging Worker: every push to main. Staging has its own
    # Fly app (fly.staging.toml) so it never shares the prod machine or its cache,
    # and config drift between the two files surfaces here before a release.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      # The app is provisioned by hand (Phase 3 of docs/plans/D1_FEED_TIMELINE.md:
      # app + volume + PROXY_SECRET), so a genuine "not provisioned yet" is allowed
      # to skip the deploy rather than fail every push to main. NOTHING ELSE IS.
      #
      # This was `flyctl status … >/dev/null 2>&1`, which read *every* failure as
      # "not provisioned" — a missing FLY_API_TOKEN included. Staging then skipped
      # its deploy on every push and still reported success, so the proxy sat on a
      # hand-deployed build while the frontend and backend moved on, and the
      # Semble context those two depend on never reached staging. A deploy that
      # cannot run has to be loud: the token and the app are checked separately,
      # and anything that isn't a clean not-found fails the job.
      - name: Check staging app exists
        id: staging_app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: skyreader-feed-proxy-staging
        run: |
          set -euo pipefail

          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is not set for the 'staging' environment, so the staging proxy cannot be deployed. Add it with: gh secret set FLY_API_TOKEN --env staging"
            exit 1
          fi

          if ! whoami_out=$(flyctl auth whoami 2>&1); then
            echo "::error::FLY_API_TOKEN is set but Fly rejected it — the staging deploy cannot authenticate."
            printf '%s\n' "$whoami_out"
            exit 1
          fi
          echo "Authenticated to Fly as: $whoami_out"

          if status_out=$(flyctl status -a "$FLY_APP" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$status_out" | grep -qiE 'could not find app|app not found|does not exist'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$FLY_APP not provisioned yet; skipping staging deploy (see docs/plans/D1_FEED_TIMELINE.md, Phase 3)."
          else
            echo "::error::flyctl status failed for $FLY_APP for a reason other than the app not existing. Refusing to skip the deploy silently."
            printf '%s\n' "$status_out"
            exit 1
          fi

      # Stamped the same way prod is, so /health reports a real commit instead of
      # the Dockerfile's `ARG GIT_COMMIT_SHA=dev` default — which is what let a
      # stale staging machine look indistinguishable from a fresh one.
      - name: Deploy
        if: steps.staging_app.outputs.exists == 'true'
        run: flyctl deploy --remote-only --config fly.staging.toml --build-arg GIT_COMMIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Staging gets the same assertion prod does: green means the staging machine
      # is answering AND running this commit. Without it, "deployed" was only ever
      # a claim about the workflow, never about the machine.
      - name: Smoke check
        if: steps.staging_app.outputs.exists == 'true'
        env:
          HEALTH_URL: https://skyreader-feed-proxy-staging.fly.dev/health
          EXPECTED_SHA: ${{ github.sha }}
        run: node ../scripts/smoke-check.mjs "$HEALTH_URL" --version "$EXPECTED_SHA"

  deploy:
    name: Deploy to Production
    needs: [typecheck, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Deploy
        run: flyctl deploy --remote-only --build-arg GIT_COMMIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Asserts the machine is answering AND running this commit. The proxy is a
      # singleton, so "deployed but wedged" is a total feed outage — worth failing
      # the workflow over.
      - name: Smoke check
        env:
          HEALTH_URL: https://skyreader-feed-proxy.fly.dev/health
          EXPECTED_SHA: ${{ github.sha }}
        run: node ../scripts/smoke-check.mjs "$HEALTH_URL" --version "$EXPECTED_SHA"
