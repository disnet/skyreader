name: Deploy Feed Proxy

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['feed-proxy/**']
  pull_request:
    branches: [main]
    paths: ['feed-proxy/**']
  release:
    types: [published]

concurrency:
  group: feed-proxy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: feed-proxy

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  deploy-staging:
    name: Deploy to Staging
    needs: [typecheck, test]
    # Same cadence as the staging Worker: every push to main. Staging has its own
    # Fly app (fly.staging.toml) so it never shares the prod machine or its cache,
    # and config drift between the two files surfaces here before a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      # The app is provisioned by hand (Phase 3 of docs/plans/D1_FEED_TIMELINE.md:
      # app + volume + PROXY_SECRET). Until that happens this job would fail on
      # every push to main, so skip it with a notice instead.
      - name: Check staging app exists
        id: staging_app
        run: |
          if flyctl status -a skyreader-feed-proxy-staging >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skyreader-feed-proxy-staging not provisioned yet; skipping staging deploy (see docs/plans/D1_FEED_TIMELINE.md, Phase 3)."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        if: steps.staging_app.outputs.exists == 'true'
        run: flyctl deploy --remote-only --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    name: Deploy to Production
    needs: [typecheck, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Deploy
        run: flyctl deploy --remote-only --build-arg GIT_COMMIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Asserts the machine is answering AND running this commit. The proxy is a
      # singleton, so "deployed but wedged" is a total feed outage — worth failing
      # the workflow over.
      - name: Smoke check
        env:
          HEALTH_URL: https://skyreader-feed-proxy.fly.dev/health
          EXPECTED_SHA: ${{ github.sha }}
        run: node ../scripts/smoke-check.mjs "$HEALTH_URL" --version "$EXPECTED_SHA"
