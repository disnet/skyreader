name: E2E Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  # head_ref is empty on merge_group; its ref is unique per queue entry.
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs one test at a time against one set of dev servers (see
  # playwright.config.ts), so it's split across runners instead. Each shard
  # starts its own feed proxy, backend and frontend.
  shard:
    name: Playwright E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install feed-proxy dependencies
        run: bun install
        working-directory: feed-proxy

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Create backend .dev.vars
        run: |
          cat > .dev.vars <<'EOF'
          FRONTEND_URL=http://127.0.0.1:5173
          ALLOWED_ORIGINS=http://127.0.0.1:5173
          FEED_PROXY_URL=http://127.0.0.1:3000
          FEED_PROXY_SECRET=test-e2e-secret
          E2E_TEST_MODE=true
          EOF
        working-directory: backend

      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Keeps the single "Playwright E2E" check that branch protection and the merge
  # queue require, whatever the shard count, and merges the shards' reports.
  e2e:
    name: Playwright E2E
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Fail if any shard failed
        if: ${{ needs.shard.result != 'success' }}
        run: |
          echo "One or more E2E shards ${{ needs.shard.result }}." >&2
          exit 1
