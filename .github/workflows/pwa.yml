name: PWA Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    # Service worker / offline behavior is a function of the frontend build and the
    # PWA test harness — no backend involved, so only run when those change.
    paths:
      - 'frontend/**'
      - 'e2e-pwa/**'
      - 'playwright.pwa.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pwa.yml'
  # The merge queue has no paths filter: every queued change runs this.
  merge_group:

concurrency:
  # head_ref is empty on merge_group; its ref is unique per queue entry.
  group: pwa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: Service Worker / Offline E2E
    runs-on: ubuntu-latest
    # Playwright's image ships chromium, webkit and the OS libraries webkit needs.
    # Installing those libraries on the bare runner (`--with-deps`) ran apt over
    # every package source: usually ~1 min, sometimes 5+, and it failed outright
    # whenever the runner's Google Chrome apt repo served a bad index. Keep the
    # tag on the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # webkit is the closest iOS Safari engine proxy. With the image tag matching
      # package-lock.json this finds both browsers already installed and does
      # nothing; after a Playwright bump that outpaces the tag it downloads the
      # new builds instead of failing, so the tag can be bumped at leisure.
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Run PWA tests
        run: npm run test:pwa

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: pwa-playwright-report
          path: playwright-report/
          retention-days: 14
