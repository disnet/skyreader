name: Deploy Linkblog Site

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['linkblog-site/**']
  release:
    types: [published]

concurrency:
  group: linkblog-deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: linkblog-site

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: linkblog-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

  deploy-staging:
    name: Deploy to Staging
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: linkblog-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No build-time API binding: the subscribe button's API/app origins are
      # derived from the request host at runtime (apiBaseFor/appUrlFor).
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=skyreader-linkblog-staging --commit-dirty=true
          workingDirectory: linkblog-site

      # The bare subdomain renders the "linkblogs live at /<handle>" placeholder;
      # a 200 containing it means SSR is alive, not just that Pages answered.
      - name: Smoke check staging
        env:
          SMOKE_URL: https://staging-linkblogs.skyreader.app
        run: node ../scripts/smoke-check.mjs "$SMOKE_URL" --contains 'Skyreader'

  deploy-production:
    name: Deploy to Production
    needs: typecheck
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: linkblog-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=skyreader-linkblog --branch=main --commit-dirty=true
          workingDirectory: linkblog-site

      - name: Smoke check production
        env:
          SMOKE_URL: https://linkblogs.skyreader.app
        run: node ../scripts/smoke-check.mjs "$SMOKE_URL" --contains 'Skyreader'
