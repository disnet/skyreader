name: Deploy Admin

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ['admin/**']
  release:
    types: [published]

concurrency:
  group: admin-deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: admin

jobs:
  typecheck:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Run tests
        run: npm test

  deploy-staging:
    name: Deploy to Staging
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update wrangler.toml with database ID
        env:
          D1_DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: sed -i "s/YOUR_D1_DATABASE_ID/$D1_DB_ID/g" wrangler.toml

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=skyreader-admin-staging --commit-dirty=true
          workingDirectory: admin

      # Hits the pages.dev origin on purpose: if the admin is later put behind
      # Cloudflare Access on a custom domain, an unauthenticated check there would
      # follow the login redirect and go red for the wrong reason.
      - name: Smoke check staging
        env:
          SMOKE_URL: https://skyreader-admin-staging.pages.dev
        run: |
          node ../scripts/smoke-check.mjs "$SMOKE_URL/_app/version.json" --version "$GITHUB_SHA"
          node ../scripts/smoke-check.mjs "$SMOKE_URL" --contains 'Skyreader Admin'

  deploy-production:
    name: Deploy to Production
    needs: typecheck
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update wrangler.toml with database ID
        env:
          D1_DB_ID: ${{ secrets.D1_DATABASE_ID }}
        run: sed -i "s/YOUR_D1_DATABASE_ID/$D1_DB_ID/g" wrangler.toml

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=skyreader-admin --branch=main --commit-dirty=true
          workingDirectory: admin

      - name: Smoke check production
        env:
          SMOKE_URL: https://skyreader-admin.pages.dev
        run: |
          node ../scripts/smoke-check.mjs "$SMOKE_URL/_app/version.json" --version "$GITHUB_SHA"
          node ../scripts/smoke-check.mjs "$SMOKE_URL" --contains 'Skyreader Admin'
