name = "skyreader-linkblog-site"
compatibility_date = "2025-11-12"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# No [vars] here on purpose. Both Pages projects (staging + production) deploy
# from this one file, so anything set here is applied to BOTH. That is how
# staging-linkblogs once ended up reading from the PRODUCTION feed proxy — pinned
# there in [vars] — and quietly rendering main-branch records against a proxy that
# only redeploys on release. Origins are derived from the request host at runtime
# instead (apiBaseFor / appUrlFor in src/lib/fields.ts).

# Public read-only linkblog renderer (linkblogs.skyreader.app).
# Server-side it reads the linkblog's target publication and its posts from the
# Skyreader API; the browser-side subscribe button calls the same API, wired via
# CSP connect-src in svelte.config.js. Both origins come from apiBaseFor() at
# request time. No feed-proxy dependency, and no shared secret to keep in step.
#
# Optional per-project overrides, set in the Cloudflare Pages dashboard:
#   API_URL         override for the server-side API origin
#   PUBLIC_API_URL  override for the subscribe button's API origin
