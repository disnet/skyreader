name = "skyreader-api"
main = "src/index.ts"
compatibility_date = "2025-09-27"
# nodejs_als: AsyncLocalStorage. Two consumers — @sentry/cloudflare's scopes, and
# our own per-request context (src/utils/request-context.ts), which is what lets a
# request id reach a log line or an outbound header without threading a parameter
# through every handler.
#
# This is a deliberately narrower flag than the `nodejs_compat` the SDK's README
# asks for: ALS is all it needs today (the full vitest suite runs under workerd
# with just this), and nodejs_compat additionally injects Node globals we don't
# want to depend on by accident. Re-check on every @sentry/cloudflare upgrade — if
# a bump starts needing more of the Node API surface, widen this to nodejs_compat.
# It coexists with global_fetch_strictly_public — different subsystems, no overlap.
compatibility_flags = ["global_fetch_strictly_public", "nodejs_als"]

[observability]
enabled = true

# Durable Objects
[durable_objects]
bindings = [
  { name = "JETSTREAM_POLLER", class_name = "JetstreamPoller" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JetstreamConsumer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RealtimeHub"]

[[migrations]]
tag = "v3"
deleted_classes = ["JetstreamConsumer"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["JetstreamPoller", "FeedRefresher"]

[[migrations]]
tag = "v5"
deleted_classes = ["RealtimeHub"]

[[migrations]]
tag = "v6"
deleted_classes = ["FeedRefresher"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "skyreader"
database_id = "YOUR_D1_DATABASE_ID"

# Environment variables
[vars]
FRONTEND_URL = "https://skyreader.app"
# linkblogs.skyreader.app is the standalone public linkblog site. It's listed here
# so its cross-origin (same-site) subscribe fetches pass CORS, and so a returnUrl
# back to it survives isValidReturnUrl after login.
ALLOWED_ORIGINS = "https://skyreader.app,https://staging.skyreader.app,https://staging-prod.skyreader.app,https://linkblogs.skyreader.app"
FEED_PROXY_URL = "https://skyreader-feed-proxy.fly.dev"
# Public base for users' linkblogs, baked into their site.standard.publication
# record's `url` field (DID-based so it survives handle changes).
LINKBLOG_PUBLIC_URL = "https://linkblogs.skyreader.app"
# Tags every Sentry event so prod and staging errors never get confused for one
# another. The DSN itself is a secret (`wrangler secret put SENTRY_DSN`); without
# it error reporting is a no-op.
SENTRY_ENVIRONMENT = "production"
# Polar billing (merchant of record). POLAR_SERVER picks the Polar environment
# ("production" | "sandbox"); the access token + webhook secret are secrets
# (`wrangler secret put`), unset = billing off. POLAR_PRODUCT_ID is the default
# product for /api/billing/checkout, filled in after provisioning.
POLAR_SERVER = "production"
POLAR_PRODUCT_ID = "b1be3773-3cd5-4fa3-b3c4-2471e492e7d9"

# Production routes
routes = [{ pattern = "api.skyreader.app", custom_domain = true }]

# Cron Triggers
# - Every minute: Cleanup tasks, ensure JetstreamPoller running
[triggers]
crons = ["* * * * *"]

# Local development overrides live in `.dev.vars`, not a named environment: nothing
# ever runs `wrangler … --env dev`. A named environment inherits nothing, so an
# `[env.dev]` carrying only FRONTEND_URL also told `wrangler types` that DB, the
# Durable Object, and the rest of `[vars]` are absent in some environment — which
# made every binding optional in the generated Env.

# Staging environment
[env.staging]
name = "skyreader-api-staging"
# Staging is MEANT to talk to its own Fly proxy (skyreader-feed-proxy-staging),
# which pushes only into the staging D1 — prod and staging as two fully isolated
# pairs, no cross-links, distinct PROXY_SECRET/FEED_PROXY_SECRET values.
#
# Billing is isolated the same way: POLAR_SERVER = "sandbox" points the SDK at
# Polar's sandbox host, which is a wholly separate account from the production
# org (own products, own customers, own tokens) — nothing carries over, so
# POLAR_PRODUCT_ID here MUST be a sandbox id, not the production one. A prod id
# under the sandbox token exists nowhere and surfaces only as a 502 from
# /api/billing/checkout. The sandbox token + webhook secret are set with
# `wrangler secret put <NAME> --env staging`; see POLAR_SETUP.md.
vars = { FRONTEND_URL = "https://staging.skyreader.app", ALLOWED_ORIGINS = "https://staging.skyreader.app,https://staging-linkblogs.skyreader.app", FEED_PROXY_URL = "https://skyreader-feed-proxy-staging.fly.dev", LINKBLOG_PUBLIC_URL = "https://staging-linkblogs.skyreader.app", SENTRY_ENVIRONMENT = "staging", POLAR_SERVER = "sandbox", POLAR_PRODUCT_ID = "4f3e636c-8dd5-4af1-af3d-b88e85b104e4" }
routes = [{ pattern = "api-staging.skyreader.app", custom_domain = true }]

# Smart Placement — STAGING ONLY, deliberately, until it is measured.
#
# Without it the Worker runs at the edge nearest the reader while D1 lives in one
# region, so every D1 call pays a full cross-network round trip. The read path is
# several *sequential* calls (session → sync_state → items → head), which is the
# shape Smart Placement exists for: it relocates the Worker next to the database,
# trading one slightly longer client→Worker leg for several much shorter
# Worker→D1 legs.
#
# It is a whole-Worker setting, not per-route, so it is scoped to `[env.staging]`
# rather than the top level: staging deploys on every push to main and prod only
# on release, which is exactly the window needed to compare `d1WallMs` against
# `d1Ms` in the `timeline_timing` / `request` log lines before prod inherits it.
# Promote it to the top level (and delete this block) once the numbers say so.
[env.staging.placement]
mode = "smart"

[env.staging.durable_objects]
bindings = [
  { name = "JETSTREAM_POLLER", class_name = "JetstreamPoller" }
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "skyreader-staging"
database_id = "YOUR_STAGING_D1_DATABASE_ID"

# Cron Triggers in staging
[env.staging.triggers]
crons = ["* * * * *"]
