name = "skyreader-api"
main = "src/index.ts"
compatibility_date = "2025-09-27"
compatibility_flags = ["global_fetch_strictly_public"]

[observability]
enabled = true

# Durable Objects
[durable_objects]
bindings = [
  { name = "JETSTREAM_POLLER", class_name = "JetstreamPoller" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JetstreamConsumer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RealtimeHub"]

[[migrations]]
tag = "v3"
deleted_classes = ["JetstreamConsumer"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["JetstreamPoller", "FeedRefresher"]

[[migrations]]
tag = "v5"
deleted_classes = ["RealtimeHub"]

[[migrations]]
tag = "v6"
deleted_classes = ["FeedRefresher"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "skyreader"
database_id = "YOUR_D1_DATABASE_ID"

# Environment variables
[vars]
FRONTEND_URL = "https://skyreader.app"
ALLOWED_ORIGINS = "https://skyreader.app,https://staging.skyreader.app,https://staging-prod.skyreader.app"
FEED_PROXY_URL = "https://skyreader-feed-proxy.fly.dev"

# Production routes
routes = [{ pattern = "api.skyreader.app", custom_domain = true }]

# Cron Triggers
# - Every minute: Cleanup tasks, ensure JetstreamPoller running
[triggers]
crons = ["* * * * *"]

# Development environment
[env.dev]
vars = { FRONTEND_URL = "http://127.0.0.1:5173" }

# Staging environment
[env.staging]
name = "skyreader-api-staging"
vars = { FRONTEND_URL = "https://staging.skyreader.app", ALLOWED_ORIGINS = "https://staging.skyreader.app", FEED_PROXY_URL = "https://skyreader-feed-proxy.fly.dev" }
routes = [{ pattern = "api-staging.skyreader.app", custom_domain = true }]

[env.staging.durable_objects]
bindings = [
  { name = "JETSTREAM_POLLER", class_name = "JetstreamPoller" }
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "skyreader-staging"
database_id = "YOUR_STAGING_D1_DATABASE_ID"

# Cron Triggers in staging
[env.staging.triggers]
crons = ["* * * * *"]
