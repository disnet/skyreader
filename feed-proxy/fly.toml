app = "skyreader-feed-proxy"
primary_region = "sjc"

# KEEP IN SYNC WITH fly.staging.toml. The two files must differ only in `app` and
# the `INGEST_URL` in [env]; everything else is deliberately identical so staging
# soaks what prod will run.
#
# TEMPORARY EXCEPTIONS (2026-08-20), both while the prod backfill drains, both
# meant to be short-lived — see the block above each setting:
#   - WARM_ENABLED is "false" here, "true" in staging.
#   - [vm] is performance/2/4096 here, shared/2/1024 in staging.
# Staging crawls ~100 feeds and was never the box under pressure, so it stays on
# the cheaper profile and keeps soaking the configuration prod will return to.
#
# SINGLETON INVARIANT — run exactly ONE machine. This app is not horizontally
# scalable as written: the cache is a SQLite DB on the per-machine `proxy_data`
# volume (volumes can't be shared between machines), and the Jetstream firehose,
# the self-warming loop, and the in-memory request-coalescing maps are all
# in-process singletons. A second machine would get its own empty volume + its
# own firehose + its own warm loop, with no shared coalescing — i.e. a split-brain
# cache, duplicate upstream fetches, and responses that differ by which machine
# you hit. Scale VERTICALLY via the [vm] block below, never by `fly scale count`.
# Keep only one machine provisioned; auto_start/stop below toggle that one machine,
# they do not create new ones.

[build]

[mounts]
  source = "proxy_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one machine alive: the self-warming loop runs in-process on a timer and
  # can only keep the cache fresh while a machine is up. Letting this drop to 0
  # would stop warming whenever traffic is idle, defeating the purpose.
  min_machines_running = 1

# ┌─ TEMPORARY, 2026-08-20 ────────────────────────────────────────────────────┐
# │ Upgraded shared/2/1024 → performance/2/4096 for the initial ingest backfill.│
# │                                                                             │
# │ Why: shared vCPUs run on burst credits, and hours of sustained crawl +      │
# │ backfill exhausts them, after which Fly throttles hard. The symptom was a   │
# │ trivial /health JSON response taking 12-25s (or timing out) while the box   │
# │ was otherwise alive — event-loop starvation, not memory. Post-deploy smoke  │
# │ checks failed six attempts straight on two consecutive releases.            │
# │                                                                             │
# │ REVERT to shared/2/1024 once the backfill has drained AND the crawl set     │
# │ stops growing — 5,586 feeds is already 4x what this box was sized for, so   │
# │ check that number before assuming the old size still fits. Downgrading is   │
# │ the same three lines in reverse plus a deploy (~13s restart, volume stays   │
# │ attached).                                                                  │
# │                                                                             │
# │ Note the memory jump is incidental: performance presets carry 2 GB/core     │
# │ minimums, so this also lifts the 1 GB ceiling that OOM'd the box earlier    │
# │ today. Do not read the absence of OOMs afterwards as proof the allocation    │
# │ fix worked — that was already proven on 1 GB before this change.            │
# └─────────────────────────────────────────────────────────────────────────────┘
[vm]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 4096

[env]
  DATA_DIR = "/data"
  # Ingest push into the prod Worker's D1.
  INGEST_URL = "https://api.skyreader.app"
  # Fresh window. The self-warming loop refreshes active feeds before they reach
  # this age, so user requests stay HITs even at a tight 5-minute freshness.
  CACHE_TTL_SECONDS = "300"
  STALE_TTL_SECONDS = "3600"
  # Self-warming loop. WARM_REFRESH_THRESHOLD defaults to a margin below CACHE_TTL;
  # set explicitly only to override. Feeds not requested within WARM_ACTIVE_WINDOW
  # stop being polled so abandoned feeds age out.
  # ┌─ TEMPORARY, 2026-08-20 ─────────────────────────────────────────────────┐
  # │ Warming is PAUSED for the initial prod ingest backfill.                 │
  # │                                                                          │
  # │ Why: on 2 shared vCPUs a 200-feed warm tick was taking ~5 minutes and    │
  # │ starving the ingest pusher (268s between pushes against a 15s interval), │
  # │ which is the backfill we are actually waiting on. The pusher drains the  │
  # │ item log the proxy has ALREADY cached, so it does not need the warmer to │
  # │ finish. Freshness is the deliberate sacrifice until the archive fills.   │
  # │                                                                          │
  # │ REVERT THIS once `ingest.pending` on /stats trends to ~0:                │
  # │   1. Set WARM_ENABLED back to "true".                                    │
  # │   2. Un-pause the `proxy-warmer` heartbeat check (see below).            │
  # │   3. Re-sync with fly.staging.toml, which deliberately still warms.      │
  # │                                                                          │
  # │ ALSO PAUSE THE ALERT: the `proxy-warmer` dead-man's switch (RUNBOOK §4,  │
  # │ 1 min period / 5 min grace, email + phone push) is pinged from INSIDE    │
  # │ this loop, so disabling it stops the heartbeat and the check will fire   │
  # │ within ~5 minutes. That page would be reporting a condition we created   │
  # │ on purpose. Pause the check for the duration rather than letting a real  │
  # │ alert cry wolf — "silence means healthy" only survives if we keep it so. │
  # └──────────────────────────────────────────────────────────────────────────┘
  WARM_ENABLED = "false"
  WARM_INTERVAL_SECONDS = "60"
  WARM_ACTIVE_WINDOW_SECONDS = "1209600"
  # Lowered 500 → 200 on 2026-08-20, during the initial prod ingest backfill.
  #
  # The old 500 was sized for "~1330 active feeds need ~440 refreshes/tick to
  # never go stale". That premise is gone: the crawl-set pull now stamps
  # last_requested_at on EVERY subscribed feed, so the active set is ~5,586 and
  # keeping it all fresh would need ~1,860/tick — unreachable at any cap this box
  # can afford. Freshness is already best-effort, so the cap's real job is now to
  # bound per-tick CPU rather than to chase a fresh-everything target.
  #
  # 200/tick cycles all 5,586 feeds in ~28 minutes (5586/200 ticks × 60s), against
  # ~11 minutes at 500. That is the accepted trade: the box was event-loop starved
  # at 500 (health checks timing out for minutes at a stretch, post-deploy smoke
  # failing) on 2 shared vCPUs while also draining the backfill.
  #
  # Raise it back once the backfill has drained and CPU headroom is measurable —
  # `/stats` reports rssMb now, and the warmer logs a saturation line every tick
  # it fills the cap, so both sides of the trade are visible.
  WARM_BATCH_CAP = "200"
  # Left at 16 deliberately: this bounds PEAK parallelism, not total work, and one
  # variable at a time makes the effect of the cap change readable.
  WARM_CONCURRENCY = "16"
  # Pre-warming network-wide mention counts (Constellation fan-out) is OFF. It was a
  # pathological amplification — 25 items × ~1330 feeds × ~14 Constellation calls per
  # tick, with 30s timeouts piling up — and measured as ~all of the machine's load
  # (2026-06-26 A/B). Mentions still enrich lazily on read (POST /mentions triggers a
  # background enrich), so the only loss is pre-warm: counts fill in a poll later on
  # brand-new articles. Turning this back on requires real global rate-limiting first,
  # not just a bigger cap.
  WARM_MENTIONS = "false"
  # /extract concurrency cap. /extract fetches up to 10 MB of HTML and builds a
  # full DOM (Defuddle) — several × the raw bytes in memory — so unbounded
  # concurrency is the realistic OOM path on this 1 GB machine. Excess callers
  # queue up to EXTRACT_QUEUE_MAX, then are shed with a 503. Raise alongside [vm]
  # memory if extractions start shedding under normal load.
  # Governor on demand-driven feed fetches (batch inline misses + the background
  # refresh a STALE read fires). Turned ON 2026-08-20 on evidence: /stats showed
  # inFlight=87 with the warmer paused, i.e. 87 concurrent upstream fetches driven
  # purely by reader polling, on 2 vCPUs, while the backfill was trying to drain.
  #
  # Set deliberately LOW during the backfill. With `fresh: 0` in the cache every
  # read already falls through to the past-stale path and gets served prior
  # content, so throttling fetches costs almost nothing user-visible right now —
  # and the CPU it frees goes to the ingest pusher, which is the thing actually
  # blocking progress. Excess fetches queue (up to FEED_FETCH_QUEUE_MAX, default
  # 500) and are shed as "no fresh content", never as a feed error.
  #
  # Raise toward WARM_CONCURRENCY (16) or above once the backfill has drained and
  # freshness matters again. Watch `feedFetch.queued` on /stats: persistently deep
  # means this is too tight for real demand.
  FEED_FETCH_CONCURRENCY = "8"

  EXTRACT_CONCURRENCY = "4"
  EXTRACT_QUEUE_MAX = "20"
