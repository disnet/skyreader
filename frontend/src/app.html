<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skyreader</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <link rel="mask-icon" href="/icons/icon-512.svg" color="#4A9FD4" />

    <!--
      The reading surface, not the brand blue. Safari 15+ paints its own bottom
      toolbar with this, and that toolbar sits directly beneath the app's mobile
      bottom bar — matching them makes the pair read as one band instead of two
      mismatched surfaces. It also paints the installed PWA's status-bar area, so
      the app opens into the same quiet surface it reads on. Sky (#4A9FD4) stays
      the identity colour on the icon and mask-icon.

      A browser takes the first theme-color whose media matches (or that has no
      media at all), so the two conditional tags lead and the unconditional
      fallback goes last, where it only lands on browsers that understand
      neither. Keep it in that order.
    -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skyreader" />
    <meta property="og:title" content="Skyreader" />
    <meta
      property="og:description"
      content="Read everything from everywhere. Make sense of it all."
    />
    <meta property="og:url" content="https://skyreader.app/" />
    <meta property="og:image" content="https://skyreader.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Skyreader. Read everything from everywhere, and make sense of it all."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skyreader" />
    <meta
      name="twitter:description"
      content="Read everything from everywhere. Make sense of it all."
    />
    <meta name="twitter:image" content="https://skyreader.app/og-image.png" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
